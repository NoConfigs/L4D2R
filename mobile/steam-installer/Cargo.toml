[package]
name = "l4d2r-steam-installer"
version = "0.1.0"
edition = "2024"

[dependencies]
steam-cdn = { path = "../../vendor/steam-cdn" }
steam-vent = { path = "../../vendor/steam-vent" }
tokio = { version = "1", features = ["rt-multi-thread", "time", "fs", "io-util", "macros"] }
serde_json = "1"
sha1 = "0.10"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"
