# Android build of the rewrite (cargo-apk, NativeActivity). Same sources as
# the desktop game: the library root src/android_main.rs includes src/main.rs.
# Built by tools/build-apk.ps1 (or the launcher's "Build Android APK").
[package]
name = "l4d2r-android"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[lib]
name = "l4d2r_android"
path = "../src/android_main.rs"
crate-type = ["cdylib"]

[dependencies]
bevy = { version = "=0.19.1", features = ["wav", "mp3", "android-native-activity"] }
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
half = "=2.7.1"
crc32fast = "=1.5.2"
l4d2-formats = { path = "../vendor/l4d2r-formats" }
l4d2r-game-core = { path = "../vendor/l4d2r-game" }
l4d2r-math = { package = "glam", version = "0.30" }
mimalloc = { version = "=0.1.52", default-features = false }

[features]
profile-trace = []

[build-dependencies]
cc = "=1.6.0"

[profile.release]
debug = false

[package.metadata.android]
package = "com.l4d2r.rewrite"
apk_name = "L4D2Rewrite"
build_targets = ["aarch64-linux-android"]
# Filled by tools/build-apk.ps1: shaders plus the bundled game data.
assets = "apk-assets"

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 34

[package.metadata.android.application]
label = "L4D2 Rewrite"
has_code = false
extract_native_libs = true

[package.metadata.android.application.activity]
orientation = "sensorLandscape"
config_changes = "orientation|screenSize|screenLayout|keyboardHidden|keyboard|navigation|uiMode"

# Keep the shared exposure readback API consistent with desktop and iOS.
[patch.crates-io]
bevy_post_process = { path = "../vendor/bevy_post_process" }
